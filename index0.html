<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQT - منصة التعليم</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --secondary: #ec4899;
  --accent: #8b5cf6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #f8fafc;
  --surface: rgba(255, 255, 255, 0.92);
  --surface-hover: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: rgba(99, 102, 241, 0.12);
  --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
  --glow: 0 0 40px rgba(99, 102, 241, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tajawal', 'Outfit', sans-serif;
  background: linear-gradient(135deg, #f0f4ff 0%, #fdf4ff 50%, #fff7ed 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ===== ANIMATED BACKGROUND ===== */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  z-index: -1;
  animation: float 20s ease-in-out infinite;
}
.orb-1 { width: 400px; height: 400px; background: #c7d2fe; top: -100px; right: -100px; animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; background: #fbcfe8; bottom: -50px; left: -50px; animation-delay: -5s; }
.orb-3 { width: 250px; height: 250px; background: #ddd6fe; top: 50%; right: 50%; animation-delay: -10s; }
.orb-4 { width: 200px; height: 200px; background: #a7f3d0; bottom: 20%; right: 10%; animation-delay: -15s; opacity: 0.3; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-30px, -30px) scale(1.1); }
  50% { transform: translate(20px, 20px) scale(0.9); }
  75% { transform: translate(-20px, 10px) scale(1.05); }
}

/* ===== PARTICLES ===== */
.particles {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(15, 23, 42, 0.12);
  border-radius: 50%;
  animation: particle-rise 15s linear infinite;
}
@keyframes particle-rise {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ===== GLASS CARD ===== */
.glass {
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

.glass-hover {
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--glow), var(--shadow);
  border-color: rgba(99, 102, 241, 0.25);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 14px;
  border: none;
  font-family: 'Tajawal', 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; right: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition: right 0.5s;
}
.btn:hover::before { right: 100%; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45);
}

.btn-secondary {
  background: rgba(255,255,255,0.7);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.95);
  border-color: var(--primary-light);
}

.btn-danger {
  background: linear-gradient(135deg, var(--danger), #dc2626);
  color: white;
}

.btn-success {
  background: linear-gradient(135deg, var(--success), #059669);
  color: white;
}

/* ===== INPUTS ===== */
.input-group {
  position: relative;
  margin-bottom: 20px;
}
.input-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.input-group input,
.input-group select,
.input-group textarea {
  width: 100%;
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.7);
  border: 2px solid rgba(99, 102, 241, 0.12);
  border-radius: 14px;
  color: var(--text);
  font-family: 'Tajawal', 'Outfit', sans-serif;
  font-size: 1rem;
  transition: all 0.3s ease;
  outline: none;
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
  background: rgba(255, 255, 255, 0.95);
}

/* ===== NAVIGATION ===== */
.nav-bar {
  position: fixed;
  top: 0; right: 0; left: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 30px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo {
  font-family: 'Space Grotesk', 'Tajawal', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -1px;
}
.nav-links {
  display: flex;
  gap: 8px;
}
.nav-link {
  padding: 8px 16px;
  border-radius: 10px;
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 700;
  transition: all 0.3s;
  cursor: pointer;
}
.nav-link:hover, .nav-link.active {
  color: var(--text);
  background: rgba(99, 102, 241, 0.1);
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.9rem;
  color: white;
}

/* ===== PAGE TRANSITIONS ===== */
.page {
  display: none;
  animation: pageIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 100px 30px 40px;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
}
.page.active { display: block; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== LOGIN PAGE ===== */
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
.login-card {
  width: 100%;
  max-width: 440px;
  padding: 48px;
  position: relative;
  overflow: hidden;
}
.login-card::after {
  content: '';
  position: absolute;
  top: -50%; right: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, var(--primary), transparent 30%);
  animation: rotate 4s linear infinite;
  opacity: 0.08;
  z-index: -1;
}
@keyframes rotate {
  100% { transform: rotate(-360deg); }
}
.login-header {
  text-align: center;
  margin-bottom: 40px;
}
.login-header h1 {
  font-family: 'Space Grotesk', 'Tajawal', sans-serif;
  font-size: 2.2rem;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-header p { color: var(--text-muted); }

/* ===== UNIT CARDS ===== */
.unit-card {
  padding: 28px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.unit-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px; height: 100%;
  background: linear-gradient(to bottom, var(--primary), var(--accent));
  border-radius: 0 24px 24px 0;
}
.unit-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  cursor: pointer;
}
.unit-number {
  display: inline-block;
  padding: 4px 14px;
  background: rgba(99, 102, 241, 0.1);
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.unit-title {
  font-size: 1.4rem;
  font-weight: 800;
}
.unit-toggle {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s;
  cursor: pointer;
  color: var(--text-muted);
}
.unit-toggle.rotated { transform: rotate(180deg); }

/* ===== LESSON ITEMS ===== */
.lessons-container {
  display: grid;
  gap: 12px;
  margin-top: 16px;
  padding-right: 16px;
}
.lesson-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: rgba(0,0,0,0.02);
  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.04);
  cursor: pointer;
  transition: all 0.3s;
}
.lesson-item:hover {
  background: rgba(99, 102, 241, 0.04);
  border-color: var(--border);
  transform: translateX(-8px);
}
.lesson-item.completed {
  opacity: 0.8;
}
.lesson-item.active {
  background: rgba(99, 102, 241, 0.06);
  border-color: rgba(99, 102, 241, 0.2);
}
.lesson-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
  color: white;
  font-weight: 800;
}
.lesson-icon.completed {
  background: linear-gradient(135deg, var(--success), #059669);
}
.lesson-info { flex: 1; }
.lesson-title { font-weight: 700; margin-bottom: 2px; }
.lesson-meta { font-size: 0.85rem; color: var(--text-muted); }
.check-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

/* ===== MATERIAL VIEWER ===== */
.material-viewer {
  padding: 32px;
  min-height: 70vh;
}
.material-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.material-type-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.badge-pdf { background: rgba(239, 68, 68, 0.08); color: #dc2626; }
.badge-quiz { background: rgba(99, 102, 241, 0.08); color: var(--primary); }
.badge-video { background: rgba(16, 185, 129, 0.08); color: #059669; }

.pdf-embed {
  width: 100%;
  height: 70vh;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.02);
}

/* ===== QUIZ INTERFACE ===== */
.quiz-container {
  max-width: 800px;
  margin: 0 auto;
}
.quiz-progress {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
}
.quiz-progress-dot {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(0,0,0,0.06);
  transition: all 0.3s;
}
.quiz-progress-dot.active { background: var(--primary); }
.quiz-progress-dot.correct { background: var(--success); }
.quiz-progress-dot.wrong { background: var(--danger); }

.question-card {
  padding: 40px;
  margin-bottom: 24px;
}
.question-text {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 28px;
  line-height: 1.5;
}

.options-grid {
  display: grid;
  gap: 12px;
}
.option-item {
  padding: 16px 20px;
  background: rgba(0,0,0,0.02);
  border: 2px solid rgba(0,0,0,0.04);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-item:hover {
  border-color: var(--primary-light);
  background: rgba(99, 102, 241, 0.04);
}
.option-item.selected {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.06);
}
.option-item.correct {
  border-color: var(--success);
  background: rgba(16, 185, 129, 0.06);
}
.option-item.wrong {
  border-color: var(--danger);
  background: rgba(239, 68, 68, 0.06);
}
.option-radio {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
}
.option-item.selected .option-radio {
  border-color: var(--primary);
  background: var(--primary);
}
.option-radio::after {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%;
  background: white;
  transform: scale(0);
  transition: transform 0.2s;
}
.option-item.selected .option-radio::after { transform: scale(1); }

/* Matching */
.matching-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.match-item {
  padding: 14px 18px;
  background: rgba(0,0,0,0.02);
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,0.04);
}
.match-select {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
}

/* Essay */
.essay-textarea {
  width: 100%;
  min-height: 200px;
  padding: 20px;
  background: rgba(0,0,0,0.02);
  border: 2px solid rgba(0,0,0,0.04);
  border-radius: 16px;
  color: var(--text);
  font-family: 'Tajawal', 'Outfit', sans-serif;
  font-size: 1rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s;
}
.essay-textarea:focus {
  border-color: var(--primary-light);
}

/* ===== ADMIN PANEL ===== */
.admin-grid {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}
.admin-sidebar {
  padding: 24px;
  height: fit-content;
  position: sticky;
  top: 90px;
}
.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 4px;
  font-weight: 700;
}
.admin-nav-item:hover, .admin-nav-item.active {
  background: rgba(99, 102, 241, 0.1);
  color: var(--text);
}

/* ===== DRAG AND DROP ===== */
.sortable-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sortable-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: rgba(0,0,0,0.02);
  border: 2px dashed rgba(0,0,0,0.08);
  border-radius: 14px;
  cursor: grab;
  transition: all 0.3s;
}
.sortable-item:hover {
  border-color: var(--primary-light);
  background: rgba(99, 102, 241, 0.04);
}
.sortable-item.dragging {
  opacity: 0.5;
  transform: scale(1.02);
  border-color: var(--primary);
}
.drag-handle {
  color: var(--text-muted);
  cursor: grab;
}

/* ===== STUDENT RECORDS ===== */
.student-card {
  padding: 24px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.student-info h3 { margin-bottom: 4px; }
.student-info p { color: var(--text-muted); font-size: 0.9rem; }

/* ===== TOASTS ===== */
.toast-container {
  position: fixed;
  bottom: 30px;
  left: 30px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  padding: 16px 24px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: var(--shadow);
  font-weight: 600;
}
.toast.success { border-color: rgba(16, 185, 129, 0.3); }
.toast.error { border-color: rgba(239, 68, 68, 0.3); }
@keyframes toastIn {
  from { transform: translateX(-100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ===== LOADING ===== */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 24px;
}
.loading-spinner {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 3px solid rgba(99, 102, 241, 0.2);
  border-top-color: var(--primary);
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(-360deg); }
}
.loading-text {
  font-family: 'Space Grotesk', 'Tajawal', sans-serif;
  font-size: 1.2rem;
  color: var(--text-muted);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s;
}
.modal-content {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  animation: scaleIn 0.3s;
}
.modal-footer {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ===== STATS CARDS ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.stat-card {
  padding: 24px;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: -20px; left: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  opacity: 0.08;
}
.stat-card.blue::after { background: var(--primary); }
.stat-card.pink::after { background: var(--secondary); }
.stat-card.green::after { background: var(--success); }
.stat-value {
  font-size: 2.2rem;
  font-weight: 800;
  margin: 8px 0;
  font-family: 'Space Grotesk', 'Tajawal', sans-serif;
}
.stat-label { color: var(--text-muted); font-size: 0.9rem; }

/* ===== CONFETTI ===== */
.confetti {
  position: fixed;
  width: 10px; height: 10px;
  z-index: 9999;
  animation: confetti-fall 3s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.4); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .admin-grid { grid-template-columns: 1fr; }
  .admin-sidebar { position: static; }
  .page { padding: 90px 16px 30px; }
  .login-card { padding: 32px 24px; }
  .matching-container { grid-template-columns: 1fr; }
}

/* ===== UTILITY ===== */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mb-4 { margin-bottom: 16px; }

  download: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`
};

// ==========================================
// CONFIGURATION
// ==========================================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwLjgKqj_e2eaMBLhSBruACOh4zDnH54Qjq04nYpkXhBhNGdMiDvNeuXzmCAULhGgEF/exec',
  SHEET_ID: '1OnvFNlJlMGrxv6UCZAZmT2cJr1SG8j2AjRHOYWWWe7U'
};

// ==========================================
// STATE MANAGEMENT
// ==========================================
const state = {
  user: null,
  units: [],
  lessons: {},
  materials: {},
  quizzes: {},
  questions: {},
  progress: null,
  attempts: [],
  currentQuiz: null,
  currentMaterial: null,
  adminSection: 'overview',
  students: [],
  allMaterials: [],
  dragItem: null
};

// ==========================================
// API SERVICE
// ==========================================
const API = {
  async get(action, params = {}) {
    const query = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${CONFIG.API_URL}?${query}`);
    return res.json();
  },

  async post(action, data = {}) {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, ...data })
    });
    return res.json();
  }
};

// For demo/development without backend
const MOCK_MODE = false;

// ==========================================
// UTILITIES
// ==========================================
function $(id) { return document.getElementById(id); }

function translateRole(role) {
  if (role === 'admin') return 'مدير';
  if (role === 'student') return 'طالب';
  return role;
}

function showToast(message, type = 'success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? ICONS.check : ICONS.alert}</span> <span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function generateParticles() {
  const container = $('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.right = Math.random() * 100 + '%';
    p.style.animationDuration = (10 + Math.random() * 20) + 's';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
    container.appendChild(p);
  }
}

function createConfetti() {
  const colors = ['#6366f1', '#ec4899', '#8b5cf6', '#10b981', '#f59e0b'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.right = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function hideLoading() {
  $('loadingScreen').style.display = 'none';
}

function formatDate(dateStr) {
  if (!dateStr) return 'غير متاح';
  return new Date(dateStr).toLocaleDateString('ar-SA', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ==========================================
// ROUTER
// ==========================================
function navigateTo(page) {
  state.currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`page-${page}`).classList.add('active');
  window.location.hash = page;

  if (state.user) setupNavigation(); // Refresh active state of links

  if (page === 'dashboard') renderDashboard();
  if (page === 'profile') renderProfile();
  if (page === 'admin') renderAdmin();
}

// ==========================================
// AUTHENTICATION
// ==========================================
async function handleLogin(e) {
  e.preventDefault();
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;

  $('loadingScreen').style.display = 'flex';

  try {
    let result;
    if (MOCK_MODE) {
      if (username === 'admin' && password === 'admin') {
        result = { success: true, user: { name: 'مدير المنصة', username: 'admin', role: 'admin' } };
      } else if (username === 'vip') {
        result = { success: true, user: { name: 'الأب الروحي', username: 'vip', role: 'vip' } };
      } else if (username === 'manager') {
        result = { success: true, user: { name: 'مدير', username: 'manager', role: 'manager' } };
      } else if (username === 'guest') {
        result = { success: true, user: { name: 'زائر', username: 'guest', role: 'guest' } };
      } else if (username === 'student' && password === 'student') {
        result = { success: true, user: { name: 'طالب تجريبي', username: 'student', role: 'student' } };
      } else {
        result = { success: false, message: 'بيانات الاعتماد غير صحيحة' };
      }
    } else {
      result = await API.get('login', { username, password });
    }

    if (result.success) {
      state.user = result.user;
      localStorage.setItem('iqt_user', JSON.stringify(result.user));
      
      // Load data for all roles to view the dashboard properly
      await loadStudentData();
      
      setupNavigation();
      showToast(`مرحباً بعودتك، ${result.user.name}!`);

      if (['admin', 'vip', 'manager'].includes(result.user.role)) {
        navigateTo('admin');
      } else {
        navigateTo('dashboard');
      }
    } else {
      showToast(result.message || 'فشل تسجيل الدخول', 'error');
    }
  } catch(err) {
    showToast('خطأ في الاتصال. تحقق من رابط API.', 'error');
    console.error(err);
  } finally {
    hideLoading();
  }
}

function setupNavigation() {
  $('navbar').classList.remove('hidden');
  $('navUsername').textContent = state.user.name;
  $('navAvatar').textContent = state.user.name.charAt(0).toUpperCase();

  const links = $('navLinks');
  let html = '';

  // All roles see Dashboard (الرئيسية) and Profile (الملف الشخصي)
  html += `<a class="nav-link ${state.currentPage === 'dashboard' ? 'active' : ''}" onclick="navigateTo('dashboard')">الرئيسية</a>`;
  
  // Only Admin, VIP, and Manager see Admin (الإدارة)
  if (['admin', 'vip', 'manager'].includes(state.user.role)) {
    html += `<a class="nav-link ${state.currentPage === 'admin' ? 'active' : ''}" onclick="navigateTo('admin')">الإدارة</a>`;
  }
  
  html += `<a class="nav-link ${state.currentPage === 'profile' ? 'active' : ''}" onclick="navigateTo('profile')">الملف الشخصي</a>`;
  
  links.innerHTML = html;
}

function logout() {
  state.user = null;
  localStorage.removeItem('iqt_user');
  $('navbar').classList.add('hidden');
  navigateTo('login');
  showToast('تم تسجيل الخروج بنجاح');
}

async function checkAuth() {
  const saved = localStorage.getItem('iqt_user');
  if (saved) {
    state.user = JSON.parse(saved);
    await loadStudentData(); // Load data for all roles to view platform
    setupNavigation();
    const hash = window.location.hash.replace('#', '') || (['admin', 'vip', 'manager'].includes(state.user.role) ? 'admin' : 'dashboard');
    navigateTo(hash);
  }
  hideLoading();
}

// ==========================================
// STUDENT DATA LOADING
// ==========================================
async function loadStudentData() {
  if (MOCK_MODE) {
    state.units = [
      { unit_id: 'u1', unit_number: 1, unit_name: 'مقدمة في البرمجة' },
      { unit_id: 'u2', unit_number: 2, unit_name: 'هياكل البيانات' }
    ];
    state.lessons['u1'] = [
      { lesson_id: 'l1', unit_id: 'u1', lesson_number: 1, lesson_name: 'المتغيرات والأنواع' },
      { lesson_id: 'l2', unit_id: 'u1', lesson_number: 2, lesson_name: 'التدفقات المنطقية' },
      { lesson_id: 'l3', unit_id: 'u1', lesson_number: 3, lesson_name: 'الدوال' }
    ];
    state.materials['l1'] = [
      { material_id: 'm1', lesson_id: 'l1', title: 'شرائح العرض', type: 'pdf', content: 'https://drive.google.com/file/d/example/preview', order_index: 0 },
      { material_id: 'm2', lesson_id: 'l1', title: 'اختبار 1', type: 'quiz', content: '', order_index: 1 }
    ];
    state.progress = {
      username: state.user.username,
      current_unit_id: 'u1',
      current_lesson_id: 'l2',
      completed_lessons: ['l1'],
      completed_materials: ['m1', 'm2']
    };
    return;
  }

  try {
    const [unitsRes, progressRes] = await Promise.all([
      API.get('getUnits'),
      API.get('getStudentProgress', { username: state.user.username })
    ]);

    if (unitsRes.success) state.units = unitsRes.units;
    if (progressRes.success) state.progress = progressRes.progress;

    for (const unit of state.units) {
      const res = await API.get('getLessons', { unitId: unit.unit_id });
      if (res.success) state.lessons[unit.unit_id] = res.lessons;

      for (const lesson of res.lessons || []) {
        const matRes = await API.get('getMaterials', { lessonId: lesson.lesson_id });
        if (matRes.success) state.materials[lesson.lesson_id] = matRes.materials;
      }
    }
  } catch(err) {
    console.error('خطأ في تحميل بيانات الطالب:', err);
  }
}

async function renderMaterialViewer(lessonId) {
  const container = $('materialContent');
  const mats = state.materials[lessonId] || [];

  if (!mats.length) {
    container.innerHTML = '<div class="text-center" style="padding: 60px;"><p>لا يوجد محتوى لهذا الدرس بعد.</p></div>';
    return;
  }

  let html = '';

  for (const mat of mats) {
    const isCompleted = state.progress?.completed_materials?.includes(mat.material_id);

    if (mat.type === 'pdf') {
      html += `
        <div class="material-header">
          <span class="material-type-badge badge-pdf">${ICONS.document} ملف PDF</span>
          <h2>${mat.title}</h2>
          ${isCompleted ? '<span style="color: var(--success); display:inline-flex; align-items:center; gap:6px;">' + ICONS.check + ' مكتمل</span>' : ''}
        </div>

          <a href="${mat.content.replace('/preview', '/view')}" target="_blank" class="btn btn-secondary">فتح في تبويب جديد</a>
          <button class="btn btn-success" onclick="markComplete('${mat.material_id}')">تحديد كمكتمل</button>
        </div>
      `;
    } else if (mat.type === 'quiz') {
      let quiz = state.quizzes[mat.material_id];
      let attempts = [];

      if (!quiz && !MOCK_MODE) {
        const res = await API.get('getQuizzes', { materialId: mat.material_id });
        if (res.success && res.quizzes.length) {
          quiz = res.quizzes[0];
          state.quizzes[mat.material_id] = quiz;
        }
      }

      if (quiz && !MOCK_MODE) {
        const attRes = await API.get('getQuizAttempts', { username: state.user.username, quizId: quiz.quiz_id });
        if (attRes.success) attempts = attRes.attempts;
      }

      const lastAttempt = attempts[0];

      html += `
        <div class="material-header">
          <span class="material-type-badge badge-quiz">${ICONS.quiz} اختبار</span>
          <h2>${mat.title}</h2>
          ${lastAttempt ? `<span style="color: var(--primary); font-weight:700;">آخر درجة: ${lastAttempt.score}/${lastAttempt.max_score}</span>` : ''}
        </div>
        <div class="text-center" style="padding: 60px;">
          <p style="margin-bottom: 20px; color: var(--text-muted);">اختبر معلوماتك بهذا الاختبار</p>
          <div style="display:flex; gap:10px; justify-content:center;">
            <button class="btn btn-primary" onclick="startQuiz('${mat.material_id}', '${quiz?.quiz_id || ''}')">بدء الاختبار</button>
            ${lastAttempt ? `<button class="btn btn-secondary" onclick="startQuiz('${mat.material_id}', '${quiz?.quiz_id || ''}')">إعادة المحاولة</button>` : ''}
          </div>
        </div>
      `;
    }
  }

  container.innerHTML = html;
}

async function markComplete(materialId) {
  if (!state.progress) {
    state.progress = { username: state.user.username, completed_lessons: [], completed_materials: [] };
  }
  if (!state.progress.completed_materials.includes(materialId)) {
    state.progress.completed_materials.push(materialId);
  }

  if (!MOCK_MODE) {
    await API.post('updateStudentProgress', state.progress);
  }

  showToast('تم تحديد المحتوى كمكتمل!');
  createConfetti();
  renderMaterialViewer(state.currentLesson);
}

async function startQuiz(materialId, quizId) {
  $('loadingScreen').style.display = 'flex';

  try {
    let questions = [];

    if (MOCK_MODE) {
      questions = [
        { question_id: 'q1', type: 'mcq', question_text: 'ما هو المتغير؟', options: ['حاوية للبيانات', 'دالة', 'حلقة تكرار', 'لا شيء'], correct_answer: 0, points: 1 },
        { question_id: 'q2', type: 'true_false', question_text: 'بايثون هي لغة مترجمة.', options: ['صح', 'خطأ'], correct_answer: 1, points: 1 },
        { question_id: 'q3', type: 'essay', question_text: 'اشرح مفهوم الاستدعاء الذاتي بكلماتك.', options: null, correct_answer: null, points: 5 }
      ];
    } else {
      const res = await API.get('getQuestions', { quizId });
      if (res.success) questions = res.questions;
    }

    state.currentQuiz = {
      materialId,
      quizId,
      questions,
      currentIndex: 0,
      answers: [],
      score: 0,
      maxScore: questions.reduce((a, q) => a + (q.points || 1), 0)
    };

    navigateTo('quiz');
    renderQuizQuestion();
  } catch(err) {
    showToast('خطأ في تحميل الاختبار', 'error');
  } finally {
    hideLoading();
  }
}

function renderQuizQuestion() {
  const quiz = state.currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  const container = $('quizContent');

  const progressHtml = quiz.questions.map((_, i) => {
    let cls = '';
    if (i < quiz.currentIndex) {
      const ans = quiz.answers[i];
      cls = ans && ans.isCorrect ? 'correct' : 'wrong';
    } else if (i === quiz.currentIndex) {
      cls = 'active';
    }
    return `<div class="quiz-progress-dot ${cls}"></div>`;
  }).join('');

  let questionHtml = '';

  if (q.type === 'mcq') {
    questionHtml = `
      <div class="options-grid">
        ${q.options.map((opt, i) => `
          <div class="option-item" onclick="selectOption(${i})" data-index="${i}">
            <div class="option-radio"></div>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'true_false') {
    questionHtml = `
      <div class="options-grid">
        ${['صح', 'خطأ'].map((opt, i) => `
          <div class="option-item" onclick="selectOption(${i})" data-index="${i}">
            <div class="option-radio"></div>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    `;
  } else if (q.type === 'essay') {
    questionHtml = `
      <textarea class="essay-textarea" id="essayAnswer" placeholder="اكتب إجابتك هنا..."></textarea>
    `;
  } else if (q.type === 'matching') {
    const pairs = q.options || [];
    questionHtml = `
      <div class="matching-container">
        ${pairs.map((pair, i) => `
          <div class="match-item">
            <strong>${pair.left}</strong>
            <select class="match-select" id="match-${i}">
              <option value="">اختر التطابق...</option>
              ${pairs.map((p, j) => `<option value="${j}">${p.right}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
    `;
  }

  container.innerHTML = `
    <div class="glass question-card">
      <div class="quiz-progress">${progressHtml}</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <span style="color: var(--text-muted); font-size: 0.9rem;">سؤال ${quiz.currentIndex + 1} من ${quiz.questions.length}</span>
        <span style="color: var(--primary); font-weight: 700;">${q.points} نقطة</span>
      </div>
      <div class="question-text">${q.question_text}</div>
      ${questionHtml}
      <div style="margin-top: 32px; display: flex; justify-content: space-between;">
        ${quiz.currentIndex > 0 ? `<button class="btn btn-secondary" onclick="prevQuestion()">${ICONS.arrowRight} السابق</button>` : '<div></div>'}
        <button class="btn btn-primary" onclick="nextQuestion()">
          ${quiz.currentIndex === quiz.questions.length - 1 ? 'إنهاء الاختبار' : 'التالي'}
          ${quiz.currentIndex === quiz.questions.length - 1 ? '' : ICONS.arrowLeft}
        </button>
      </div>
    </div>
  `;
}

function selectOption(index) {
  document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.option-item[data-index="${index}"]`).classList.add('selected');
}

function prevQuestion() {
  state.currentQuiz.currentIndex--;
  renderQuizQuestion();
}

function nextQuestion() {
  const quiz = state.currentQuiz;
  const q = quiz.questions[quiz.currentIndex];
  let answer = null;
  let isCorrect = false;

  if (q.type === 'mcq' || q.type === 'true_false') {
    const selected = document.querySelector('.option-item.selected');
    if (!selected) {
      showToast('يرجى اختيار إجابة', 'error');
      return;
    }
    answer = parseInt(selected.dataset.index);
    isCorrect = answer === q.correct_answer;
  } else if (q.type === 'essay') {
    answer = $('essayAnswer').value.trim();
    if (!answer) {
      showToast('يرجى كتابة إجابة', 'error');
      return;
    }
    isCorrect = null;
  } else if (q.type === 'matching') {
    const pairs = q.options || [];
    answer = [];
    let allCorrect = true;
    pairs.forEach((_, i) => {
      const val = $(`match-${i}`).value;
      answer.push({ left: i, right: parseInt(val) });
      if (parseInt(val) !== i) allCorrect = false;
    });
    isCorrect = allCorrect;
  }

  quiz.answers[quiz.currentIndex] = {
    question_id: q.question_id,
    type: q.type,
    answer: answer,
    isCorrect: isCorrect,
    points: isCorrect ? q.points : (isCorrect === null ? 0 : 0)
  };

  if (isCorrect) quiz.score += q.points;

  if (quiz.currentIndex < quiz.questions.length - 1) {
    quiz.currentIndex++;
    renderQuizQuestion();
  } else {
    submitQuiz();
  }
}

async function submitQuiz() {
  const quiz = state.currentQuiz;
  const hasEssay = quiz.answers.some(a => a.type === 'essay');

  $('quizContent').innerHTML = `
    <div class="glass text-center" style="padding: 60px;">
      <div style="font-size: 4rem; margin-bottom: 20px; color: var(--warning);">${ICONS.star}</div>
      <h2 style="margin-bottom: 16px;">تم تسليم الاختبار!</h2>
      <p style="color: var(--text-muted); margin-bottom: 8px;">
        ${hasEssay ? 'إجاباتك المقالية بانتظار التصحيح اليدوي.' : `الدرجة: ${quiz.score} من ${quiz.maxScore}`}
      </p>
      <button class="btn btn-primary mt-4" onclick="navigateTo('dashboard')">العودة للرئيسية</button>
    </div>
  `;

  if (!MOCK_MODE) {
    await API.post('submitQuiz', {
      username: state.user.username,
      quiz_id: quiz.quizId,
      material_id: quiz.materialId,
      answers: quiz.answers,
      score: quiz.score,
      max_score: quiz.maxScore
    });
  }

  createConfetti();
  showToast('تم تسليم الاختبار بنجاح!');
}

function setupDragAndDrop() {
  const list = $('sortableMaterials');
  if (!list) return;

  let draggedItem = null;

  list.querySelectorAll('.sortable-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggedItem = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedItem = null;
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (item === draggedItem) return;
      const rect = item.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        list.insertBefore(draggedItem, item);
      } else {
        list.insertBefore(draggedItem, item.nextSibling);
      }
    });
  });
}

async function saveMaterialOrder() {
  const items = document.querySelectorAll('.sortable-item');
  const materials = Array.from(items).map((item, index) => ({
    material_id: item.dataset.id,
    order_index: index
  }));

  if (!MOCK_MODE) {
    await API.post('updateMaterialOrder', { materials });
  }

  showToast('تم حفظ ترتيب المحتويات!');
}

async function renderAdminQuizzes(container) {
  container.innerHTML = `
    <div class="flex justify-between items-center" style="margin-bottom: 24px;">
      <h2 style="font-family: 'Space Grotesk', 'Tajawal', sans-serif;">إدارة الاختبارات</h2>
      <div class="flex gap-2">
        <button class="btn btn-secondary" onclick="showModal('importQuiz')">${ICONS.import} استيراد اختبار</button>
        <button class="btn btn-primary" onclick="showModal('addQuiz')">${ICONS.plus} إنشاء اختبار</button>
      </div>
    </div>
    <div id="quizList"></div>
  `;

  const quizList = $('quizList');
  let html = '';

  for (const unit of state.units) {
    for (const lesson of (state.lessons[unit.unit_id] || [])) {
      for (const mat of (state.materials[lesson.lesson_id] || [])) {
        if (mat.type === 'quiz') {
          html += `
            <div class="glass" style="padding: 20px; margin-bottom: 12px;">
              <div class="flex justify-between items-center">
                <div>
                  <h4>${mat.title}</h4>
                  <p style="color: var(--text-muted); font-size: 0.85rem;">${unit.unit_name} → ${lesson.lesson_name}</p>
                </div>
                <button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showModal('addQuestion', '${mat.material_id}')">${ICONS.plus} إضافة سؤال</button>
              </div>
            </div>
          `;
        }
      }
    }
  }

  quizList.innerHTML = html || '<div class="glass text-center" style="padding: 40px;"><p>لا توجد اختبارات. أنشئ محتوى من نوع "اختبار" أولاً.</p></div>';
}

async function renderAdminStudents(container) {
  container.innerHTML = '<div class="loading-text" style="text-align:center;padding:40px;">جاري تحميل الطلاب...</div>';

  let students = [];
  if (MOCK_MODE) {
    students = [{ name: 'طالب تجريبي', username: 'student', role: 'student' }];
  } else {
    const res = await API.get('getAllStudents');
    if (res.success) students = res.students;
  }

  container.innerHTML = `
    <h2 style="margin-bottom: 24px; font-family: 'Space Grotesk', 'Tajawal', sans-serif;">الطلاب</h2>
    <div id="studentsList">
      ${students.map(s => `
        <div class="glass student-card">
          <div class="student-info">
            <h3>${s.name}</h3>
            <p>@${s.username}</p>
          </div>
          <button class="btn btn-secondary" onclick="viewStudentDetails('${s.username}')">عرض التفاصيل</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function viewStudentDetails(username) {
  let details;
  if (MOCK_MODE) {
    details = {
      username,
      progress: { completed_lessons: ['l1'], completed_materials: ['m1'] },
      attempts: [{ score: 8, max_score: 10, is_graded: true, attempt_date: new Date().toISOString() }]
    };
  } else {
    const res = await API.get('getStudentDetails', { username });
    details = res;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="glass modal-content">
      <div class="flex justify-between items-center" style="margin-bottom: 20px;">
        <h2>${details.username} - التفاصيل</h2>
        <button class="btn btn-secondary" style="padding: 8px 12px;" onclick="this.closest('.modal-overlay').remove()">${ICONS.close}</button>
      </div>
      <h3 style="margin-bottom: 12px;">التقدم</h3>
      <p style="color: var(--text-muted); margin-bottom: 20px;">
        الدروس المكتملة: ${details.progress?.completed_lessons?.length || 0}<br>
        المحتويات المكتملة: ${details.progress?.completed_materials?.length || 0}
      </p>
      <h3 style="margin-bottom: 12px;">محاولات الاختبار</h3>
      ${(details.attempts || []).map(att => `
        <div style="padding: 12px; background: rgba(0,0,0,0.02); border-radius: 10px; margin-bottom: 8px;">
          الدرجة: ${att.score}/${att.max_score} | ${att.is_graded ? 'تم التصحيح' : 'معلق'} | ${formatDate(att.attempt_date)}
        </div>
      `).join('') || '<p style="color: var(--text-muted);">لا توجد محاولات بعد.</p>'}
    </div>
  `;
  document.body.appendChild(modal);
}

async function renderAdminGrading(container) {
  container.innerHTML = '<div class="loading-text" style="text-align:center;padding:40px;">جاري تحميل الدرجات المعلقة...</div>';

  let attempts = [];
  if (MOCK_MODE) {
    attempts = [];
  } else {
    const res = await API.get('getQuizAttempts', { username: null, quizId: null });
    if (res.success) {
      attempts = res.attempts.filter(a => !a.is_graded && a.answers.some(ans => ans.type === 'essay'));
    }
  }

  container.innerHTML = `
    <h2 style="margin-bottom: 24px; font-family: 'Space Grotesk', 'Tajawal', sans-serif;">بانتظار التصحيح</h2>
    ${attempts.length ? attempts.map(att => `
      <div class="glass" style="padding: 24px; margin-bottom: 16px;">
        <div class="flex justify-between items-center" style="margin-bottom: 16px;">
          <div>
            <h4>@${att.username}</h4>
            <p style="color: var(--text-muted); font-size: 0.85rem;">${formatDate(att.attempt_date)}</p>
          </div>
          <span style="color: var(--warning); display:inline-flex; align-items:center; gap:6px;">${ICONS.clock} معلق</span>
        </div>
        ${att.answers.filter(a => a.type === 'essay').map((ans, i) => `
          <div style="margin-bottom: 16px; padding: 16px; background: rgba(0,0,0,0.02); border-radius: 10px;">
            <p style="font-weight: 700; margin-bottom: 8px;">إجابة مقالية ${i + 1}:</p>
            <p style="color: var(--text-muted);">${ans.answer}</p>
          </div>
        `).join('')}
        <div class="flex gap-2" style="margin-top: 16px;">
          <input type="number" class="input-group" style="width: 100px; margin: 0;" placeholder="الدرجة" id="grade-${att.attempt_id}">
          <button class="btn btn-success" onclick="submitGrade('${att.attempt_id}')">تسليم الدرجة</button>
        </div>
      </div>
    `).join('') : '<div class="glass text-center" style="padding: 40px;"><p>لا توجد درجات معلقة. عمل رائع!</p></div>'}
  `;
}

async function submitGrade(attemptId) {
  const score = $(`grade-${attemptId}`).value;
  if (!score) {
    showToast('يرجى إدخال درجة', 'error');
    return;
  }

  if (!MOCK_MODE) {
    await API.post('gradeEssay', {
      attempt_id: attemptId,
      score: parseFloat(score),
      graded_by: state.user.username,
      feedback: ''
    });
  }

  showToast('تم تسليم الدرجة!');
  renderAdmin();
}

// ==========================================
// MODALS
// ==========================================
function showModal(type, id = null) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'activeModal';

  let content = '';

  if (type === 'addUnit') {
    content = `
      <h3 style="margin-bottom: 20px;">إضافة وحدة جديدة</h3>
      <div class="input-group">
        <label>رقم الوحدة</label>
        <input type="number" id="unitNumber" placeholder="مثال: 1">
      </div>
      <div class="input-group">
        <label>اسم الوحدة</label>
        <input type="text" id="unitName" placeholder="مثال: مقدمة في البرمجة">
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitUnit()">إضافة وحدة</button>
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  } else if (type === 'addLesson') {
    content = `
      <h3 style="margin-bottom: 20px;">إضافة درس جديد</h3>
      <input type="hidden" id="lessonUnitId" value="${id}">
      <div class="input-group">
        <label>رقم الدرس</label>
        <input type="number" id="lessonNumber" placeholder="مثال: 1">
      </div>
      <div class="input-group">
        <label>اسم الدرس</label>
        <input type="text" id="lessonName" placeholder="مثال: المتغيرات والأنواع">
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitLesson()">إضافة درس</button>
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  } else if (type === 'addMaterial') {
    content = `
      <h3 style="margin-bottom: 20px;">إضافة محتوى</h3>
      <input type="hidden" id="materialLessonId" value="${id}">
      <div class="input-group">
        <label>العنوان</label>
        <input type="text" id="materialTitle" placeholder="مثال: شرائح العرض">
      </div>
      <div class="input-group">
        <label>النوع</label>
        <select id="materialType" onchange="toggleMaterialFields()">
          <option value="pdf">PDF / مستند</option>
          <option value="quiz">اختبار</option>
          <option value="video">فيديو</option>
        </select>
      </div>
      <div class="input-group" id="contentField">
        <label>المحتوى / الرابط</label>
        <input type="text" id="materialContent" placeholder="رابط تضمين Google Drive">
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitMaterial()">إضافة محتوى</button>
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  } else if (type === 'addQuiz') {
    content = `
      <h3 style="margin-bottom: 20px;">إنشاء اختبار</h3>
      <p style="color: var(--text-muted); margin-bottom: 16px;">أولاً، أنشئ محتوى من نوع "اختبار" في قسم المحتوى، ثم أضف الأسئلة هنا.</p>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>
      </div>
    `;
  } else if (type === 'addQuestion') {
    content = `
      <h3 style="margin-bottom: 20px;">إضافة سؤال</h3>
      <input type="hidden" id="questionQuizId" value="${id}">
      <div class="input-group">
        <label>نوع السؤال</label>
        <select id="questionType" onchange="toggleQuestionFields()">
          <option value="mcq">اختيار من متعدد</option>
          <option value="true_false">صح / خطأ</option>
          <option value="matching">توصيل</option>
          <option value="essay">مقالي</option>
        </select>
      </div>
      <div class="input-group">
        <label>نص السؤال</label>
        <textarea id="questionText" rows="3" placeholder="أدخل السؤال..."></textarea>
      </div>
      <div class="input-group">
        <label>النقاط</label>
        <input type="number" id="questionPoints" value="1" min="1">
      </div>
      <div id="optionsContainer">
        <div class="input-group">
          <label>الخيارات (واحد لكل سطر)</label>
          <textarea id="questionOptions" rows="4" placeholder="الخيار 1
الخيار 2
الخيار 3
الخيار 4"></textarea>
        </div>
        <div class="input-group">
          <label>الإجابة الصحيحة (الرقم، يبدأ من 0)</label>
          <input type="number" id="questionCorrect" value="0" min="0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitQuestion()">إضافة سؤال</button>
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  } else if (type === 'importQuiz') {
    content = `
      <h3 style="margin-bottom: 20px;">استيراد اختبار (JSON)</h3>
      <p style="color: var(--text-muted); margin-bottom: 16px; font-size: 0.9rem;">
        ألصق JSON الاختبار أدناه. التنسيق:<br>
        <code style="background: rgba(0,0,0,0.04); padding: 2px 6px; border-radius: 4px;">
          {"title": "اسم الاختبار", "material_id": "...", "questions": [{"type":"mcq","question_text":"...","options":["أ","ب"],"correct_answer":0,"points":1}]}
        </code>
      </p>
      <div class="input-group">
        <label>JSON الاختبار</label>
        <textarea id="importJson" rows="10" placeholder='{"title": "اختباري", "material_id": "...", "questions": [...]}'></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="submitImport()">استيراد</button>
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      </div>
    `;
  }

  modal.innerHTML = `<div class="glass modal-content">${content}</div>`;
  document.body.appendChild(modal);
}

function closeModal() {
  const modal = $('activeModal');
  if (modal) modal.remove();
}

function toggleMaterialFields() {
  const type = $('materialType').value;
  const field = $('contentField');
  if (type === 'quiz') {
    field.style.display = 'none';
  } else {
    field.style.display = 'block';
  }
}

function toggleQuestionFields() {
  const type = $('questionType').value;
  const container = $('optionsContainer');
  if (type === 'essay') {
    container.style.display = 'none';
  } else {
    container.style.display = 'block';
  }
}

// ==========================================
// FORM SUBMISSIONS
// ==========================================
async function submitUnit() {
  const data = {
    unit_number: parseInt($('unitNumber').value),
    unit_name: $('unitName').value
  };

  if (!MOCK_MODE) {
    await API.post('addUnit', data);
  }

  showToast('تمت إضافة الوحدة!');
  closeModal();
  await loadStudentData();
  renderAdmin();
}

async function submitLesson() {
  const data = {
    unit_id: $('lessonUnitId').value,
    lesson_number: parseInt($('lessonNumber').value),
    lesson_name: $('lessonName').value
  };

  if (!MOCK_MODE) {
    await API.post('addLesson', data);
  }

  showToast('تمت إضافة الدرس!');
  closeModal();
  await loadStudentData();
  renderAdmin();
}

async function submitMaterial() {
  const data = {
    lesson_id: $('materialLessonId').value,
    title: $('materialTitle').value,
    type: $('materialType').value,
    content: $('materialContent')?.value || ''
  };

  if (!MOCK_MODE) {
    await API.post('addMaterial', data);
  }

  showToast('تمت إضافة المحتوى!');
  closeModal();
  await loadStudentData();
  renderAdmin();
}

async function submitQuestion() {
  const type = $('questionType').value;
  let options = null;
  let correct = null;

  if (type !== 'essay') {
    options = $('questionOptions').value.split('\n').map(s => s.trim()).filter(s => s);
    correct = parseInt($('questionCorrect').value);
  }

  const data = {
    quiz_id: $('questionQuizId').value,
    type: type,
    question_text: $('questionText').value,
    options: options,
    correct_answer: correct,
    points: parseInt($('questionPoints').value) || 1,
    order_index: 0
  };

  if (!MOCK_MODE) {
    await API.post('addQuestion', data);
  }

  showToast('تمت إضافة السؤال!');
  closeModal();
  renderAdmin();
}

async function submitImport() {
  try {
    const json = JSON.parse($('importJson').value);

    if (!MOCK_MODE) {
      await API.post('importQuiz', json);
    }

    showToast(`تم استيراد ${json.questions.length} أسئلة!`);
    closeModal();
    renderAdmin();
  } catch(err) {
    showToast('تنسيق JSON غير صالح', 'error');
  }
}

// ==========================================
// INITIALIZATION
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  generateParticles();
  checkAuth();
});

// Handle browser back/forward
window.addEventListener('hashchange', () => {
  const page = window.location.hash.replace('#', '') || 'login';
  if (page !== 'login' && !state.user) {
    navigateTo('login');
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`page-${page}`).classList.add('active');
});
</script>
