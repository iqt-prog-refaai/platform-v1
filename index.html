<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQT - منصة التعليم</title>
<meta name="description" content="منصة IQT التعليمية - تعلّم بشكل تفاعلي مع وحدات ودروس واختبارات متنوعة">
<meta property="og:title" content="IQT - منصة التعليم">
<meta property="og:description" content="منصة IQT التعليمية - تعلّم بشكل تفاعلي مع وحدات ودروس واختبارات متنوعة">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- ===== CSS ===== -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>
<div class="bg-orb orb-4"></div>
<div class="particles" id="particles"></div>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">جاري تحميل IQT...</div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Navigation (hidden until login) -->
<nav class="nav-bar hidden" id="navbar">
  <div class="nav-logo">IQT</div>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-user">
    <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" onclick="navigateTo('profile')" title="الملف الشخصي">
      <span id="navUsername"></span>
      <div class="avatar" id="navAvatar"></div>
    </div>
    <button class="btn btn-secondary" style="padding:8px 16px;font-size:0.85rem;" onclick="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      خروج
    </button>
  </div>
</nav>

<!-- ==================== LOGIN PAGE ==================== -->
<div class="page active" id="page-login">
  <div class="login-container">
    <div class="glass login-card">
      <div class="login-header">
        <h1>مرحباً بعودتك</h1>
        <p>سجل الدخول لمتابعة رحلتك التعليمية</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>اسم المستخدم</label>
          <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم" required>
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">
          تسجيل الدخول
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ==================== STUDENT DASHBOARD ==================== -->
<div class="page" id="page-dashboard">
  <div style="margin-bottom: 32px;">
    <h1 style="font-family: 'Space Grotesk', 'Tajawal', sans-serif; font-size: 2.2rem; margin-bottom: 8px;">
      مرحباً، <span id="studentName" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">طالب</span>
    </h1>
    <p style="color: var(--text-muted);">استأنف من حيث توقفت</p>
  </div>
  <div class="stats-grid" id="studentStats"></div>
  <div id="unitsContainer"></div>
</div>

<!-- ==================== MATERIAL VIEWER ==================== -->
<div class="page" id="page-material">
  <button class="btn btn-secondary mb-4" onclick="navigateTo('dashboard')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    العودة للرئيسية
  </button>
  <div class="glass material-viewer" id="materialContent"></div>
</div>

<!-- ==================== QUIZ PAGE ==================== -->
<div class="page" id="page-quiz">
  <div class="quiz-container" id="quizContent"></div>
</div>

<!-- ==================== PROFILE PAGE ==================== -->
<div class="page" id="page-profile">
  <h1 style="font-family: 'Space Grotesk', 'Tajawal', sans-serif; font-size: 2rem; margin-bottom: 24px;">ملفي الشخصي</h1>
  <div class="glass" style="padding: 32px; margin-bottom: 24px;">
    <div class="flex items-center gap-4 mb-4">
      <div id="profileAvatarContainer" style="position: relative;">
        <!-- Avatar will be inserted here -->
        <div class="avatar" style="width: 80px; height: 80px; font-size: 1.8rem;" id="profileAvatar"></div>
        <button class="btn btn-primary" style="position: absolute; bottom: -5px; right: -5px; padding: 6px; border-radius: 50%;" onclick="$('avatarUploadInput').click()" title="تغيير الصورة">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <button id="deleteAvatarBtn" class="btn btn-secondary" style="position: absolute; top: -5px; left: -5px; padding: 6px; border-radius: 50%; color: var(--danger); display: none; background: white; border-color: rgba(239,68,68,0.2);" onclick="deleteAvatar()" title="حذف الصورة">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <input type="file" id="avatarUploadInput" style="display: none;" accept="image/*" onchange="handleAvatarUpload(event)">
      </div>
      <div>
        <h2 id="profileName" style="margin:0;">طالب</h2>
        <div id="profileRoleBadge" style="margin-top: 8px;"></div>
      </div>
    </div>
    
    <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
      <h3 style="margin-bottom: 16px;">إعدادات الحساب</h3>
      <div class="input-group" style="max-width: 400px; margin-top: 16px;">
        <label>اسم المستخدم (يجب أن يكون حروف وأرقام إنجليزية فقط)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="profileUsername" pattern="[a-zA-Z0-9_]+" style="direction:ltr;">
          <button class="btn btn-secondary" onclick="updateUsername()">تحديث</button>
        </div>
      </div>
      <div class="input-group" style="max-width: 400px; margin-top: 16px;">
        <label>تغيير كلمة المرور</label>
        <div style="display:flex; gap:8px;">
          <input type="password" id="profilePassword" placeholder="كلمة المرور الجديدة">
          <button class="btn btn-secondary" onclick="updatePassword()">تحديث</button>
        </div>
      </div>
    </div>
  </div>
  <h2 style="margin-bottom: 16px;">سجل الاختبارات</h2>
  <div id="quizHistory"></div>
</div>

<!-- ==================== ADMIN DASHBOARD ==================== -->
<div class="page" id="page-admin">
  <div class="admin-grid">
    <div class="glass admin-sidebar">
      <h3 style="margin-bottom: 20px; font-family: 'Space Grotesk', 'Tajawal', sans-serif;">لوحة الإدارة</h3>
      <div class="admin-nav-item active" onclick="showAdminSection('overview')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        نظرة عامة
      </div>
      <div class="admin-nav-item" onclick="showAdminSection('content')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        المحتوى
      </div>
      <div class="admin-nav-item" onclick="showAdminSection('quizzes')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        الاختبارات
      </div>
      <div class="admin-nav-item" onclick="showAdminSection('users')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        المستخدمين
      </div>
      <div class="admin-nav-item" onclick="showAdminSection('grading')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        التصحيح
      </div>
    </div>
    <div id="adminContent"></div>
  </div>
</div>

<!-- ===== JS — load order matters: config → state → api → utils → router → features → init ===== -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="js/auth.js"></script>
<script src="js/student.js"></script>
<script src="js/material.js"></script>
<script src="js/quiz.js"></script>
<script src="js/profile.js"></script>
<script src="js/admin.js"></script>
<script src="js/modals.js"></script>
<script src="js/init.js"></script>

</body>
</html>
